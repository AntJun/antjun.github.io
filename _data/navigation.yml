docs-zh:
  - title:      <i class="fa fa-globe"></i> 一言
    children:
      - title: <p id="hitokoto">:D 获取中...</p>

               <script src="https://cdn.jsdelivr.net/npm/bluebird@3/js/browser/bluebird.min.js"></script>

               <script>
                 fetch('https://v1.hitokoto.cn/?c=b')
                   .then(function (res){
                     return res.json();
                   })
                   .then(function (data) {
                     var hitokoto = document.getElementById('hitokoto');
                     hitokoto.innerText = data.hitokoto; 
               })
                   .catch(function (err) {
                     console.error(err);
                   })
               </script>

  - title:      扩展
    children:
      - title:  音乐
        url:    http://music.163.com/playlist?id=3183686521&userid=349534750
